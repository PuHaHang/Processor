name: Python Production Deployment

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    environment:
      name: prod_recipe_it_processor

    env:
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AWS_RDS_SECRETS_MANAGER: ${{ secrets.AWS_RDS_SECRETS_MANAGER }}
      AWS_RDS_SECRET_NAME: ${{ secrets.AWS_RDS_SECRET_NAME }}

      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      AWS_SQS_POLL_COUNT: ${{ vars.AWS_SQS_POLL_COUNT }}
      AWS_SQS_MAX_NUMBER_OF_MESSAGES: ${{ vars.AWS_SQS_MAX_NUMBER_OF_MESSAGES }}
      AWS_SQS_WAIT_TIME_SECONDS: ${{ vars.AWS_SQS_WAIT_TIME_SECONDS }}
      AWS_SQS_VISIBILITY_TIMEOUT: ${{ vars.AWS_SQS_VISIBILITY_TIMEOUT }}
      AWS_SQS_QUEUE_URL: ${{ secrets.AWS_SQS_QUEUE_URL }}

      MODEL_PATH: ${{ vars.MODEL_PATH }}
      ZEROSHOT_MODEL_NAME: ${{ vars.ZEROSHOT_MODEL_NAME }}
      AWS_SQS_MAX_DEPTH: ${{ vars.AWS_SQS_MAX_DEPTH }}

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Create and use ARM64 builder
        run: |
          docker buildx create --name arm64-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download ONNX CPU 모델 from S3
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p src/resources/models
          aws s3 sync s3://${{ secrets.AWS_S3_BUCKET_NAME }}/models/ src/resources/models/ --region $AWS_REGION --exclude "*" --include "*.onnx"

      - name: Download FCM Service Account Key
        run: |
          mkdir -p src/resources/keys
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET_NAME }}/${{ vars.FCM_KEY_S3_PATH}} src/resources/keys/recipe-it-fcm-admin.json --region $AWS_REGION

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Authenticate with Google Cloud (using SA JSON)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set GCP project and configure Artifact Registry auth
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud auth configure-docker ${{ vars.ARTIFACT_HOST }}

      - name: Build and push ARM image to Artifact Registry
        run: |
          IMAGE_URI=${{ vars.ARTIFACT_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ vars.GCP_REPO_NAME }}/${{ vars.GCP_IMAGE_NAME }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker buildx build \
            --platform linux/arm64 \
            -t $IMAGE_URI \
            --push \
            .
  
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: prod_recipe_it_processor
    
    steps:
      
      - name: Authenticate with Google Cloud (using SA JSON)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set GCP project and configure Artifact Registry auth
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud auth configure-docker ${{ vars.ARTIFACT_HOST }}

      - name: Build and push ARM image to Artifact Registry
        run: |
          IMAGE_URI=${{ vars.ARTIFACT_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ vars.GCP_REPO_NAME }}/${{ vars.GCP_IMAGE_NAME }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Get image digest
        id: push-digest
        run: |
          REPO_PATH=${{ env.ARTIFACT_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ vars.GCP_REPO_NAME }}
          DIGEST=$(gcloud artifacts docker images list $REPO_PATH \
                  --filter="IMAGE~${{ vars.GCP_IMAGE_NAME }}" \
                  --format="get(DIGEST)" --limit=1)

          IMAGE_URI="${{ vars.ARTIFACT_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ vars.GCP_REPO_NAME }}/${{ vars.GCP_IMAGE_NAME }}@$DIGEST"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Update job
        run: |
          gcloud run jobs update ${{ vars.GCP_JOB_NAME }} \
          --image=$IMAGE_URI \
          --region=${{ vars.GCP_REGION }} \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --set-env-vars="
            SERVER_PORT=${{ vars.SERVER_PORT }},
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }},
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }},
            POSTGRES_DB=${{ secrets.POSTGRES_DB }},
            AWS_RDS_SECRETS_MANAGER=${{ secrets.AWS_RDS_SECRETS_MANAGER }},
            AWS_RDS_SECRET_NAME=${{ secrets.AWS_RDS_SECRET_NAME }},
            AWS_REGION=${{ vars.AWS_REGION }},
            AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }},
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }},
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }},
            AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }},
            DOCKER_IMAGE_NAME=${{ vars.DOCKER_IMAGE_NAME }},
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},
            AWS_SQS_POLL_COUNT=${{ vars.AWS_SQS_POLL_COUNT }},
            AWS_SQS_MAX_NUMBER_OF_MESSAGES=${{ vars.AWS_SQS_MAX_NUMBER_OF_MESSAGES }},
            AWS_SQS_WAIT_TIME_SECONDS=${{ vars.AWS_SQS_WAIT_TIME_SECONDS }},
            AWS_SQS_VISIBILITY_TIMEOUT=${{ vars.AWS_SQS_VISIBILITY_TIMEOUT }},
            AWS_SQS_QUEUE_URL=${{ secrets.AWS_SQS_QUEUE_URL }},
            MODEL_PATH=${{ vars.MODEL_PATH }},
            ZEROSHOT_MODEL_NAME=${{ vars.ZEROSHOT_MODEL_NAME }},
            AWS_SQS_MAX_DEPTH=${{ vars.AWS_SQS_MAX_DEPTH }},
            FCM_KEY_S3_PATH=${{ vars.FCM_KEY_S3_PATH }},
            IMAGE_PATH=${{ vars.IMAGE_PATH }},
            COOKIES_S3_PATH=${{ vars.COOKIES_S3_PATH }},
            AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }},
            LOGFIRE_TOKEN=${{ secrets.LOGFIRE_TOKEN }}
          "

