name: Python Production Deployment

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    environment:
      name: prod_recipe_it_processor

    env:
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AWS_RDS_SECRETS_MANAGER: ${{ secrets.AWS_RDS_SECRETS_MANAGER }}

      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FCM_SERVICE_ACCOUNT_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}
      
      AWS_SQS_POLL_COUNT: ${{ vars.AWS_SQS_POLL_COUNT }}
      AWS_SQS_MAX_NUMBER_OF_MESSAGES: ${{ vars.AWS_SQS_MAX_NUMBER_OF_MESSAGES }}
      AWS_SQS_WAIT_TIME_SECONDS: ${{ vars.AWS_SQS_WAIT_TIME_SECONDS }}
      AWS_SQS_VISIBILITY_TIMEOUT: ${{ vars.AWS_SQS_VISIBILITY_TIMEOUT }}
      AWS_SQS_QUEUE_URL: ${{ vars.AWS_SQS_QUEUE_URL }}

      MODEL_PATH: ${{ vars.MODEL_PATH }}
      ZEROSHOT_MODEL_NAME: ${{ vars.ZEROSHOT_MODEL_NAME }}

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download ONNX CPU 모델 from S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p src/resources/models
          aws s3 sync s3://${{ secrets.AWS_S3_BUCKET_NAME }}/models/ src/resources/models/ --region $AWS_REGION --exclude "*" --include "*.onnx"

      - name: Set FCM Service Account Key
        run: |
          echo ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }} > src/resources/keys/recipe-it-fcm-admin.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_IMAGE_NAME }} .

      - name: Push Docker image to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          docker tag ${{ secrets.DOCKER_IMAGE_NAME }}:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.DOCKER_IMAGE_NAME }}:latest