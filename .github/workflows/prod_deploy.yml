name: Python Production Deployment

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    environment:
      name: prod_recipe_it_processor

    env:
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AWS_RDS_SECRETS_MANAGER: ${{ secrets.AWS_RDS_SECRETS_MANAGER }}

      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FCM_SERVICE_ACCOUNT_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}
      
      AWS_SQS_POLL_COUNT: ${{ vars.AWS_SQS_POLL_COUNT }}
      AWS_SQS_MAX_NUMBER_OF_MESSAGES: ${{ vars.AWS_SQS_MAX_NUMBER_OF_MESSAGES }}
      AWS_SQS_WAIT_TIME_SECONDS: ${{ vars.AWS_SQS_WAIT_TIME_SECONDS }}
      AWS_SQS_VISIBILITY_TIMEOUT: ${{ vars.AWS_SQS_VISIBILITY_TIMEOUT }}
      AWS_SQS_QUEUE_URL: ${{ secrets.AWS_SQS_QUEUE_URL }}

      MODEL_PATH: ${{ vars.MODEL_PATH }}
      ZEROSHOT_MODEL_NAME: ${{ vars.ZEROSHOT_MODEL_NAME }}

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download ONNX CPU 모델 from S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p src/resources/models
          aws s3 sync s3://${{ secrets.AWS_S3_BUCKET_NAME }}/models/ src/resources/models/ --region $AWS_REGION --exclude "*" --include "*.onnx"

      - name: Set FCM Service Account Key
        run: |
          mkdir -p src/resources/keys
          printf "%s" "${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}" > src/resources/keys/recipe-it-fcm-admin.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_IMAGE_NAME }} .


      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Push Docker image to ECR
        run: |
          docker tag ${{ secrets.DOCKER_IMAGE_NAME }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
  
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: prod_recipe_it_processor
    
    steps:
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Get image digest
        id: push-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ secrets.DOCKER_IMAGE_NAME }} \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageDigest' \
            --output text)

          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.DOCKER_IMAGE_NAME }}:$DIGEST"
          echo "::set-output name=image_uri::$IMAGE_URI"
          echo "Pushed image digest: $IMAGE_URI"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.AWS_TASK_NAME }} \
            --query 'taskDefinition' > task-def.json

      - name: Update ECS task definition with new image
        id: update-task-def
        run: |
          IMAGE_URI="${{ steps.push-digest.outputs.image_uri }}"

          jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def.json > new-task-def.json

          echo "Registering new task definition revision..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "New Task Definition ARN: $NEW_TASK_DEF_ARN"

