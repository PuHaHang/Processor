[tool:pytest]
# 테스트 디렉토리 설정
testpaths = test

# 파이썬 파일 패턴
python_files = test_*.py *_test.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*
pythonpath = . src
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
env = 
    TESTING = true
    CI = true
    ; --cov=src
    ; --cov-report=html
    ; --cov-report=term-missing
    ; --cov-fail-under=80

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 최소 파이썬 버전
minversion = 6.0

# 비동기 테스트 설정
asyncio_mode = auto

# 경고 필터
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 테스트 실행 설정
timeout = 300
timeout_method = thread

# 마커 정의
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    slow: 실행 시간이 긴 테스트
    external: 외부 의존성이 있는 테스트
    asyncio: 비동기 테스트
    performance: 성능 테스트
    smoke: 스모크 테스트
    regression: 회귀 테스트
    repository: 레포지토리 테스트
    service: 서비스 테스트